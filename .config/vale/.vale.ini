StylesPath = styles
MinAlertLevel = suggestion
Vocab = Clay

Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

[*.py]
BasedOnStyles = Vale, Slop
Vale.Spelling = NO
Vale.Terms = NO
# numpydoc puts the type and the description on consecutive lines
Vale.Repetition = NO
# "the shape of the" is a numpy shape, not a metaphor
Slop.Metaphor = NO
# "the desired pixel", "the given array" are precise here
Slop.EmptyQualifiers = NO

[*.md]
BasedOnStyles = Vale, Slop, STE, Clay
STE.Ambiguity = NO
Vale.Spelling = NO
Vale.Terms = NO
Slop.Metaphor = NO
Slop.EmptyQualifiers = NO
# "stitching", "training", "rendering" are nouns in this codebase
STE.Gerunds = NO
# these target step-by-step manuals, not reference docs
STE.ProcedureLength = NO
STE.OneInstruction = NO
STE.Dictionary = NO

STE.SentenceLength = NO
